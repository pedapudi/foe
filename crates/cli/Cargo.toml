[package]
name = "foe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime for autonomous coding agents: one bounded episode per invocation"

[[bin]]
name = "foe"
path = "src/main.rs"

[dependencies]
foe-log = { path = "../log" }
foe-contract = { path = "../contract" }
foe-telemetry = { path = "../telemetry" }
foe-core = { path = "../core" }
foe-code = { path = "../code" }
foe-view = { path = "../view" }
foe-workflow = { path = "../workflow" }
foe-context = { path = "../context" }
foe-transport = { path = "../transport", optional = true, default-features = false, features = ["exec"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["io-std", "signal"] }
# Turns terminal echo off while a secret is typed into `foe login`.
nix = { version = "0.31", features = ["term", "fs"] }

[features]
default = ["transport", "http"]
# The transport crate: a `model` block resolved against the provider table,
# and the `exec` seam, which reaches a model through a program over standard
# input and output. Without this feature every model request must be
# answered by a host.
transport = ["dep:foe-transport"]
# The built-in HTTP clients and `foe login`. Without this feature the only
# `model` block that resolves is an `exec` one, and the binary links no TLS
# stack. `docs/protocol.md` describes the mode that wants such a build.
http = ["transport", "foe-transport/default"]

[dev-dependencies]
tempfile.workspace = true
