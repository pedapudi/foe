[package]
name = "foe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime for autonomous coding agents: one bounded episode per invocation"

[[bin]]
name = "foe"
path = "src/main.rs"

[dependencies]
foe-log = { path = "../log" }
foe-contract = { path = "../contract" }
foe-telemetry = { path = "../telemetry" }
foe-core = { path = "../core" }
foe-team = { path = "../team" }
foe-code = { path = "../code" }
foe-view = { path = "../view" }
foe-workflow = { path = "../workflow" }
foe-context = { path = "../context" }
foe-transport = { path = "../transport" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio = { workspace = true, features = ["io-std", "signal"] }
# Turns terminal echo off while a secret is typed into `foe login`.
nix = { version = "0.31", features = ["term", "fs"] }

[dev-dependencies]
tempfile.workspace = true
