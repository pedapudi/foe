[package]
name = "foe-view"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Log projection, HTTP and SSE server, static export"
build = "build.rs"

[dependencies]
foe-log = { path = "../log" }
serde.workspace = true
serde_json.workspace = true
# Inflating the embedded bundle, which is stored deflated. Compression is
# done by view/build.mjs with the zlib Node already links, so nothing here
# compresses and no build dependency is added.
miniz_oxide = "0.8"
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
# Reads the terminal window size for the conversation display.
rustix = { version = "1", features = ["termios"] }

[dev-dependencies]
tempfile.workspace = true
# The progress line tests measure elapsed seconds on tokio's virtual clock,
# which the test-util feature provides.
tokio = { workspace = true, features = ["test-util"] }
