[package]
name = "foe-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Episode runtime: config, identity, grants, budget, registry, loop, spawn, teams, sandbox, host protocol"

[dependencies]
foe-log = { path = "../log" }
foe-program = { path = "../program" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
sha2.workspace = true
hex.workspace = true
async-trait.workspace = true
ignore.workspace = true
cap-std.workspace = true
landlock = "0.4"
nix = { version = "0.31", features = ["signal", "process", "fs"] }
# Maps a caller-supplied descriptor to a fixed number in a child, between
# fork and exec. This crate forbids unsafe code, so the mapping cannot be a
# `pre_exec` hook written here.
command-fds = "0.3"

# The tests of the retry backoff run on a virtual clock, which tokio offers
# only under this feature.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
