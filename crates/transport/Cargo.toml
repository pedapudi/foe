[package]
name = "foe-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in model clients: wire formats times credential sources, behind feature flags"

[features]
default = ["messages", "chat", "responses", "gemini", "api-key", "token-file", "google", "exec"]
# The HTTP client and the TLS stack it needs. Every wire format implies it;
# an embedder that wants only `exec` leaves it off and links no TLS.
http = ["dep:rustls", "dep:webpki-roots"]
# Wire formats. A provider row needs its format's feature.
messages = ["http"]
chat = ["http"]
responses = ["http"]
gemini = ["http"]
# Credential sources. A provider row needs its source's feature. Each one
# speaks to its provider — to verify a key, to refresh a token — so each
# implies the client.
api-key = ["http"]
token-file = ["http", "dep:base64"]
google = ["http", "dep:ring", "dep:base64"]
# The out-of-tree seam: a contract spoken to over standard input and output.
exec = []

[dependencies]
foe-core = { path = "../core" }
foe-log = { path = "../log" }
foe-contract = { path = "../contract" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
sha2.workspace = true
# The home directory comes from the passwd database, never from `HOME`.
nix = { version = "0.31", features = ["user"] }
# TLS with the ring provider and Mozilla's roots compiled in. The system
# certificate store is never read. No crate in this tree reads an
# environment variable. Both arrive with `http` and with nothing else.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
# RS256 for service-account assertions; already in the tree through rustls.
ring = { version = "0.17", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tempfile.workspace = true
