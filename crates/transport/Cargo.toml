[package]
name = "foe-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in model clients: wire formats paired with credential sources"

[dependencies]
foe-core = { path = "../core" }
foe-log = { path = "../log" }
foe-contract = { path = "../contract" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
async-trait.workspace = true
sha2.workspace = true
# The home directory comes from the passwd database, never from `HOME`.
nix = { version = "0.31", features = ["user"] }
# TLS with the ring provider and Mozilla's roots compiled in. The system
# certificate store is never read. No crate in this tree reads an
# environment variable.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["time"] }
# RS256 for service-account assertions; already in the tree through rustls.
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
