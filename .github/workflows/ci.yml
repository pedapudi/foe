name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Provisional ceiling for the stripped release binary, in bytes (8 MiB).
  # Lowered to the measured size once a release has been measured.
  BINARY_SIZE_LIMIT: 8388608

jobs:
  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Bazel version pinned in .bazelversion
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Build the foe binary
        run: bazel build --lockfile_mode=error //:foe

      - name: Check the Bazel binary size
        run: |
          size=$(stat -c %s bazel-bin/crates/cli/foe)
          echo "bazel-bin/crates/cli/foe: ${size} bytes (limit ${BINARY_SIZE_LIMIT})"
          test "${size}" -le "${BINARY_SIZE_LIMIT}"

      - name: Build the hosted binary
        run: bazel build --lockfile_mode=error //:foe-hosted

      # The reason the target exists. `//:foe-hosted` is the binary for the
      # mode `docs/protocol.md` describes, where a host answers every model
      # request and foe opens no socket, so nothing in it should reach a
      # TLS stack. The check reads the binary rather than the build graph,
      # because it is the shipped bytes that matter: `rustls` and `webpki`
      # appear in panic paths and type names, and `DigiCert` is one of the
      # roots `webpki-roots` compiles in. Any of the three coming back means
      # the feature wiring has stopped holding.
      - name: Check the hosted binary links no TLS stack
        run: |
          for name in rustls webpki DigiCert; do
            if grep -qa "${name}" bazel-bin/crates/cli/foe-hosted; then
              echo "bazel-bin/crates/cli/foe-hosted contains ${name}" >&2
              exit 1
            fi
            if ! grep -qa "${name}" bazel-bin/crates/cli/foe; then
              echo "bazel-bin/crates/cli/foe no longer contains ${name}; the check above proves nothing" >&2
              exit 1
            fi
          done
          echo "no TLS stack in the hosted binary"

      - name: Compare the two binary sizes
        run: |
          full=$(stat -c %s bazel-bin/crates/cli/foe)
          hosted=$(stat -c %s bazel-bin/crates/cli/foe-hosted)
          echo "bazel-bin/crates/cli/foe:        ${full} bytes"
          echo "bazel-bin/crates/cli/foe-hosted: ${hosted} bytes ($((full - hosted)) fewer)"
          test "${hosted}" -lt "${full}"
          test "${hosted}" -le "${BINARY_SIZE_LIMIT}"

      # The two examples the hosted binary is for: one where the host answers
      # every model request over the protocol, and one where a program does.
      # Both are in the `rust` job's `scripts/examples.sh` run against the
      # full binary; here they prove the hosted binary serves them too.
      - name: Run the hosted examples against the hosted binary
        run: |
          python3 examples/host-transport/run.py "${PWD}/bazel-bin/crates/cli/foe-hosted"
          sh examples/exec-transport/run.sh "${PWD}/bazel-bin/crates/cli/foe-hosted"

      - name: Test the end-to-end examples
        run: bazel test --lockfile_mode=error //examples/...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The feature set `//:foe-hosted` is built from, reached through Cargo
      # the way an embedder reaches it. The Bazel target is the artifact that
      # ships; this keeps the Cargo side of the same wiring from drifting.
      - name: Hosted feature set
        run: |
          cargo build -p foe --no-default-features --features transport
          cargo test -p foe --no-default-features --features transport

      - name: Line budget
        run: scripts/loc.sh

      # The slow tier. `cargo test --workspace` waits on no real clock; the
      # examples do, so they are a separate command. Three of them also have
      # Bazel targets, which the bazel job runs against the release binary.
      - name: Examples
        run: |
          cargo build -p foe
          scripts/examples.sh target/debug/foe

      - name: Install pnpm at the version pinned in view/package.json
        uses: pnpm/action-setup@v4
        with:
          package_json_file: view/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: view/pnpm-lock.yaml

      # The binary embeds the browser bundle, so the bundle is built first.
      # Without it the crate embeds a placeholder and the size measured
      # below is not the size of the binary that ships.
      - name: Build the browser bundle
        working-directory: view
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Release build
        run: |
          cargo build --release -p foe
          strip target/release/foe

      - name: Binary size
        run: |
          size=$(stat -c %s target/release/foe)
          echo "target/release/foe: ${size} bytes (limit ${BINARY_SIZE_LIMIT})"
          test "${size}" -le "${BINARY_SIZE_LIMIT}"

  view:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: view
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm at the version pinned in view/package.json
        uses: pnpm/action-setup@v4
        with:
          package_json_file: view/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: view/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and check the bundle size
        run: pnpm build

      - name: Check the committed bundle
        run: git diff --exit-code -- dist

      - name: Test
        run: pnpm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Test
        run: uv run pytest
