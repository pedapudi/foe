name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Provisional ceiling for the stripped release binary, in bytes (8 MiB).
  # Lowered to the measured size once a release has been measured.
  BINARY_SIZE_LIMIT: 8388608

jobs:
  bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Bazel version pinned in .bazelversion
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Build the foe binary
        run: bazel build --lockfile_mode=error //:foe

      - name: Check the Bazel binary size
        run: |
          size=$(stat -c %s bazel-bin/crates/cli/foe)
          echo "bazel-bin/crates/cli/foe: ${size} bytes (limit ${BINARY_SIZE_LIMIT})"
          test "${size}" -le "${BINARY_SIZE_LIMIT}"

      - name: Test the end-to-end examples
        run: bazel test --lockfile_mode=error //examples/...

  rust:
    runs-on: ubuntu-latest
    steps:
      # The cross-harness evaluation tests regenerate task workspaces with
      # git archive from commits in the repository's history, so the clone
      # holds the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Line budget
        run: scripts/loc.sh

      - name: Script guards and measurement folds
        run: |
          python3 scripts/loc_test.py
          python3 scripts/release_test.py
          python3 evals/episode_cost/episode_cost_test.py

      # The slow tier. `cargo test --workspace` waits on no real clock; the
      # examples do, so they are a separate command. Three of them also have
      # Bazel targets, which the bazel job runs against the release binary.
      - name: Examples
        run: |
          cargo build -p foe
          scripts/examples.sh target/debug/foe

      # This step decides whether the cross-harness evaluation tests run. The
      # path list holds every repository path the tests import, run, or read:
      # the evaluation (evals/cross_harness/, the shared evals modules it
      # imports or runs, and evals/BUILD.bazel), the runtime it drives
      # (crates/, the Cargo manifest and lockfile, and the pinned toolchain),
      # the Python package host_runtime.py imports (python/), the line
      # ceiling script the task tests parse (scripts/loc.sh), and this
      # workflow file. A test that starts reading another path adds it here.
      # The tests run on every push to main, and elsewhere when the change
      # touches a listed path. A pull request is compared with its base
      # commit, and a push with the commit the branch held before it. A base
      # that is absent, all zeros, or missing from the clone leaves the change
      # unknown, so the tests run. A git failure during the comparison also
      # runs them.
      - name: Decide whether the cross-harness evaluation tests run
        id: cross_harness_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -- evals/cross_harness evals/BUILD.bazel evals/host_runtime.py \
            evals/runtime_responses.py evals/foe_build.py evals/trace_quality.py \
            crates Cargo.toml Cargo.lock rust-toolchain.toml python scripts/loc.sh \
            .github/workflows/ci.yml
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$PULL_REQUEST_BASE
          else
            base=$PUSH_BEFORE
          fi
          if [ "$EVENT_NAME" = push ] && [ "$REF" = refs/heads/main ]; then
            run=true
            reason="a push to main"
          elif [ -z "$(printf '%s' "$base" | tr -d 0)" ]; then
            run=true
            reason="no base commit to compare with"
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            run=true
            reason="base commit ${base} is absent from the clone"
          elif git diff --quiet "$base" HEAD -- "$@"; then
            run=false
            reason="no change since ${base} touches a path the tests depend on"
          else
            run=true
            reason="the change since ${base} touches a path the tests depend on"
            git diff --name-only "$base" HEAD -- "$@" | head -n 20 || true
          fi
          echo "Cross-harness evaluation tests: run=${run} (${reason})"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

      # The deterministic tests of the cross-harness evaluation. They need no
      # model credential, no network, and no Codex login. They run against
      # target/debug/foe, which the Examples step builds, and against the git
      # history the checkout fetched. --forbid-skips turns an absent binary or
      # an absent history into a failure rather than a skipped test.
      - name: Cross-harness evaluation tests
        if: steps.cross_harness_scope.outputs.run == 'true'
        run: sh evals/cross_harness/run_unit_tests.sh --forbid-skips

      - name: Test the Python host against the built binary
        working-directory: python
        run: |
          uv sync --all-extras
          uv run pytest

      - name: Install pnpm at the version pinned in view/package.json
        uses: pnpm/action-setup@v4
        with:
          package_json_file: view/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: view/pnpm-lock.yaml

      # The binary embeds the browser bundle, so the bundle is built first.
      # Without it the crate embeds a placeholder and the size measured
      # below is not the size of the binary that ships.
      - name: Build the browser bundle
        working-directory: view
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Release build
        run: |
          cargo build --release -p foe
          strip target/release/foe

      - name: Binary size
        run: |
          size=$(stat -c %s target/release/foe)
          echo "target/release/foe: ${size} bytes (limit ${BINARY_SIZE_LIMIT})"
          test "${size}" -le "${BINARY_SIZE_LIMIT}"

  view:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: view
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm at the version pinned in view/package.json
        uses: pnpm/action-setup@v4
        with:
          package_json_file: view/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: view/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and check the bundle size
        run: pnpm build

      - name: Check the committed bundle
        run: git diff --exit-code -- dist

      - name: Test
        run: pnpm test
