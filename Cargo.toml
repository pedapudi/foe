[workspace]
resolver = "2"
members = ["crates/log", "crates/core", "crates/code", "crates/transport", "crates/workflow", "crates/view", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pedapudi/foe"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "fs"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
ignore = "0.4"

# Release profile tuned for size. The binary budget is a test; see docs/design.md.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
