[workspace]
resolver = "2"
members = [
    "crates/log",
    "crates/contract",
    "crates/adoption",
    "crates/core",
    "crates/code",
    "crates/transport",
    "crates/workflow",
    "crates/context",
    "crates/view",
    "crates/cli",
    "crates/telemetry",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pedapudi/foe"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "fs"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
ignore = "0.4"
regex = "1"
cap-std = "4.0"
tempfile = "3"

# Release profile tuned for size. The binary budget is a test; see docs/design.md.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Dependencies are optimized in the development profile. Fingerprinting hashes the
# running binary, which is 112 MB unoptimized, and an unoptimized SHA-256 over
# it costs seconds on every `foe plan` and every episode a test starts.
[profile.dev.package."*"]
opt-level = 3
