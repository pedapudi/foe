<section id="run" aria-labelledby="h-run">
  <div class="wrap">

    <div class="two herorow">
      <div class="herotext">
        <h1 id="h-run"><span class="wordmark">foe</span><span class="tagline">a friendly autonomous coding agent</span></h1>
      </div>
      <div class="heromarkcol">
        <figure class="fig heromark">
          <svg id="hero-mark" viewBox="22 12 112 112" role="img"
               aria-label="The foe mark: a core, twelve rays in three weights, two rings measuring what the run spent against what it held in reserve, and a dashed ring at the limit the run never crosses."></svg>
        </figure>
      </div>
    </div>

    <div class="cmd install" style="margin-top:clamp(20px,3vw,34px)">

      <div>
        <div class="term term--tall floated" data-term="run">
          <button class="ctl icon" type="button" data-act="replay" aria-label="replay" title="replay" disabled>__REPLAY__</button>
          <pre class="termbody" tabindex="0" aria-label="Terminal transcript: the whole run as foe --conversation prints it"><code></code></pre>
        </div>
      </div>
    </div>

  </div>
