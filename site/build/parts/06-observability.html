
<!-- ======================== the viewer ========================= -->
<section id="viewer" aria-labelledby="h-obs">
  <div class="wrap">
    <div class="head">
      <h2 id="h-obs">Built-in observability</h2>
      <p class="cap">Understand what foe did with its built-in viewer and OpenTelemetry integration.</p>
    </div>

    <div class="two viewpanes">
      <div class="term term--tall floated" data-term="viewer">
        <p class="ctlname">conversation</p>
        <button class="ctl icon" type="button" data-act="replay" aria-label="replay" title="replay" disabled>__REPLAY__</button>
        <pre class="termbody" tabindex="0" aria-label="The run as the viewer shows it: one block per turn, with the connector column carrying the branch"><code></code></pre>
      </div>
      <div class="statpane">
        <p class="ctlname">statistics</p>
        <div class="figs" id="stats"></div>
      </div>
    </div>

  </div>
</section>
