[project]
name = "foe"
version = "0.1.0"
description = "Host package for the foe runtime: builds the configuration document, runs the binary, and serves the host protocol."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
litellm = ["litellm>=1.40"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["foe"]
